<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f14">
  <meta name="author" content="SuperEssence Studio">
  <meta name="description" content="Prisme par SuperEssence Studio — éditeur photo complet : calques, masques, retouche, réglages pro, filtres et looks.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Prisme Photo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Écran d'ouverture : SuperEssence Studio présente Prisme -->
  <div id="splash" aria-label="SuperEssence Studio présente Prisme">
    <div class="splash-studio">
      <img src="icons/superessence.png" alt="SuperEssence">
      <div class="splash-studio-name">S T U D I O</div>
      <div class="splash-presents">présente</div>
    </div>
    <div class="splash-app">
      <img src="icons/icon-256.png" alt="">
      <div class="splash-app-name">Prisme</div>
      <div class="splash-app-sub">Éditeur photo</div>
      <div class="splash-bar"><i></i></div>
    </div>
  </div>
  <div id="app">
    <header id="topbar">
      <button class="icon-btn mobile-only" id="btn-menu" title="Menu"></button>
      <div class="brand"><img src="icons/logo-ui.png" alt=""><span>Prisme</span></div>
      <nav id="menubar" class="desktop-only" aria-label="Menus"></nav>
      <div class="spacer"></div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-undo" title="Annuler (Ctrl+Z)"></button>
        <button class="icon-btn" id="btn-redo" title="Rétablir (Ctrl+Y)"></button>
        <button class="icon-btn" id="btn-compare" title="Avant / après (maintenir)"></button>
        <button class="zoom-chip desktop-only" id="zoom-label" title="Ajuster à l'écran">100 %</button>
        <button class="btn primary" id="btn-export"><span class="desktop-only">Exporter</span></button>
      </div>
    </header>
    <div id="optionsbar"></div>
    <main id="workspace">
      <aside id="toolbar" aria-label="Outils"></aside>
      <section id="stage">
        <canvas id="canvas"></canvas>
        <div id="welcome" hidden></div>
        <div id="busy" hidden><div class="spinner"></div><span>Traitement…</span></div>
      </section>
      <aside id="sidebar">
        <div class="sheet-handle mobile-only"></div>
        <div id="panel-tabs"></div>
        <div id="panel-body"></div>
      </aside>
    </main>
    <footer id="statusbar" class="desktop-only"></footer>
    <nav id="mobile-tabs" class="mobile-only"></nav>
  </div>
  <div id="overlays"></div>
  <input type="file" id="file-input" accept="image/*,.prisme,.json" hidden>
  <script type="module" src="js/main.js"></script>
</body>
</html>
