name: Compiler Prisme (Android + Windows)

on:
  workflow_dispatch:
  push:
    branches: [main, master, ccr-2549c042-0i5zo3]
    tags: ['v*']

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Capacitor
        run: |
          npm install --no-audit --no-fund --save @capacitor/core@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/app@6
          npm install --no-audit --no-fund --save-dev @capacitor/cli@6 @capacitor/assets@3

      - name: Créer le projet Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Icônes et écran de démarrage
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Prisme.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Prisme-Android-APK
          path: Prisme.apk

  windows:
    name: Application Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer
        run: npm install --no-audit --no-fund

      - name: Compiler l'installateur et la version portable
        run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: Prisme-Windows
          path: |
            dist/*.exe

  web:
    name: Version web (PWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: Prisme-Web
          path: www/
