name: Compiler Prisme (Android + Windows)

on:
  workflow_dispatch:
  push:
    branches: [main, master, ccr-2549c042-0i5zo3]
    tags: ['v*']

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Capacitor
        run: |
          npm install --no-audit --no-fund --save @capacitor/core@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/app@6
          npm install --no-audit --no-fund --save-dev @capacitor/cli@6 @capacitor/assets@3

      - name: Créer le projet Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Icônes et écran de démarrage
        run: |
          npx @capacitor/assets generate --android --iconBackgroundColor '#0b0b12' --iconBackgroundColorDark '#0b0b12' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'
          # Vérifie que l'icône adaptative (Android 8+) vient bien du logo Prisme
          ls android/app/src/main/res/mipmap-xxxhdpi/
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_background.png

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Prisme.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Prisme-Android-APK
          path: Prisme.apk

  windows:
    name: Application Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer
        run: npm install --no-audit --no-fund

      - name: Compiler l'installateur et la version portable
        run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: Prisme-Windows
          path: |
            dist/*.exe

  web:
    name: Version web (PWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: Prisme-Web
          path: www/

  release:
    name: Publier les fichiers (Release)
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: Préparer les fichiers
        run: |
          mkdir -p files
          cp out/Prisme-Android-APK/Prisme.apk files/Prisme.apk
          cp out/Prisme-Windows/*.exe files/
          ls -la files

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Prisme 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            **Prisme Photo** — une création SuperEssence Studio.

            - 📱 **Android** : `Prisme.apk` (autoriser « Installer des applications inconnues »)
            - 💻 **Windows** : `Prisme-Setup-1.0.0.exe` (installateur) ou `Prisme-Portable-1.0.0.exe` (sans installation).
              Si Windows SmartScreen s'affiche : *Informations complémentaires → Exécuter quand même*.
          files: files/*
