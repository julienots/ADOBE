name: Build APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master, ccr-2549c042-0i5zo3]

jobs:
  android:
    name: Compile l'APK
    runs-on: ubuntu-latest
    steps:
      - name: Vérifie les secrets Unity
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Ajoute les secrets UNITY_LICENSE, UNITY_EMAIL et UNITY_PASSWORD (voir README)."
            exit 1
          fi

      - name: Libère de l'espace disque
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-

      - name: Build Unity (Android)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildName: OrbRush
          androidExportType: androidPackage

      - name: Publie l'APK
        uses: actions/upload-artifact@v4
        with:
          name: OrbRush-apk
          path: build/Android/*.apk
